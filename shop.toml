# ══════════════════════════════════════════════════════════════════════
#  НАСТРОЙКИ МАГАЗИНА (то, что видят покупатели)
#
#  Файл открывается обычным Блокнотом. Меняйте только текст в кавычках
#  и цифры. Строки, которые начинаются с #, — это пояснения, их не трогайте.
#  После правки напишите боту /reload (или перезапустите start.bat).
#
#  Значения взяты с сайта MuzFlowers. Помеченное «ПРОВЕРЬТЕ» — предположение.
# ══════════════════════════════════════════════════════════════════════

[shop]
name = "MuzFlowers"
phone = "+7 (917) 549-49-41"
address = "Москва, Земляной Вал, 39/1, стр. 1"
landmark = "подземный переход у Курского вокзала"
open = "08:00"
close = "21:00"
# Как написать часы работы словами. Пусто — бот сам напишет «Ежедневно, 8:00–21:00».
hours_text = ""
# Карточка магазина в Яндекс Картах и страница отзывов
map_url = "https://yandex.ru/maps/org/muzflowers/31877720651/"
reviews_url = "https://yandex.ru/maps/org/muzflowers/31877720651/reviews/"
# Telegram-канал магазина, без @
telegram_channel = "muzflowers"
# Личный Telegram менеджера, без @ (например: ivan_flowers). Нужен для кнопки
# «Перейти в чат с менеджером». Пусто — кнопки не будет, а вопросы клиентов
# придут вам прямо в бота, и вы сможете отвечать из него же.
manager_username = ""
timezone = "Europe/Moscow"
# За сколько минут в рабочее время отвечаем клиентам (правило магазина)
response_minutes = 15


[orders]
# true — временно не принимать заказы (букеты видно, заказать нельзя).
# То же самое можно сделать из бота: «👑 Панель» → «⚙️ Ещё» → «⏸ Пауза заказов».
paused = false
pause_message = "Сейчас не принимаем заказы в боте — позвоните нам, соберём вручную."
# Минимальная сумма заказа, ₽ (0 — без ограничения)
min_order = 0
# На сколько дней вперёд можно заказать
max_days_ahead = 60
# Самовывоз: за сколько минут готовим заказ
pickup_lead_minutes = 20
# Доставка на сегодня: минимум минут от оформления до начала окна приезда курьера
delivery_lead_minutes = 120
# Окна времени (для доставки и самовывоза). Формат «с-до», 24 часа.
slots = [
  "09:00-11:00",
  "11:00-13:00",
  "13:00-15:00",
  "15:00-17:00",
  "17:00-19:00",
  "19:00-21:00",
]
# Правило магазина: букет на определённую дату — только с полной предоплатой.
# true — заказ не на сегодня можно оформить только с предоплатой.
prepay_future_orders = true
# Разрешить оплату при получении (наличными или картой) — для заказов на сегодня
allow_pay_on_receipt = true
# Как оплатить переводом. Этот текст клиент увидит, выбрав «Перевод/ссылка от менеджера».
# Например: "Перевод по СБП на +7 900 000-00-00 (Т-Банк), получатель — Имя Ф." Пусто — менеджер сам пришлёт ссылку.
payment_details = ""
# Сколько заказов одного клиента могут быть «в работе» одновременно (защита от спама)
max_active_orders = 5


[delivery]
enabled = true
# Доставка бесплатна от этой суммы заказа, ₽ (0 — бесплатной доставки нет). ПРОВЕРЬТЕ: предположение.
free_from = 3000
area_text = "Доставляем по Москве. За МКАД и в другие города — по договорённости, стоимость рассчитает менеджер."
# Зоны доставки с ценой. Можно добавить свои строки, например по районам.
# ПРОВЕРЬТЕ: 300 ₽ — предположение, впишите настоящую цену.
zones = [
  { name = "По Москве (в пределах МКАД)", price = 300 },
]


[certificates]
# Кнопки с суммами подарочных сертификатов, ₽
amounts = [1000, 3000, 5000]
# Можно ввести свою сумму — от и до, ₽
min = 500
max = 30000
# Сколько дней действует сертификат
valid_days = 365


# ── АКЦИИ И ПРОМОКОДЫ ───────────────────────────────────────────────
# Постоянных скидок и карты лояльности у магазина нет — только акции. Поэтому у
# каждого промокода обязательно указывайте срок («until»). Чтобы включить акцию,
# уберите # в начале строк ниже и поправьте значения.
#
# [[promo]]
# code = "ВЕСНА"            # что вводит клиент (регистр не важен)
# percent = 10              # скидка в процентах от стоимости букетов...
# amount = 0                # ...или в рублях (одно из двух)
# min_order = 2000          # от какой суммы букетов действует (0 — без ограничения)
# first_order_only = false  # true — только на первый заказ клиента
# until = "2026-12-31"      # последний день акции, ГГГГ-ММ-ДД
