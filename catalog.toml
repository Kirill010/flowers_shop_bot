# ══════════════════════════════════════════════════════════════════════
#  КАТАЛОГ: 20 позиций (12 букетов и 8 горшечных растений)
#
#  Как менять: откройте в Блокноте, поправьте цену или текст, сохраните и
#  напишите боту /reload. Нового товара — скопируйте блок [[product]] целиком.
#
#  sku       короткое имя латиницей без пробелов. По нему подбирается фото:
#            положите файл photos\<sku>.jpg (например photos\classic.jpg)
#            или пришлите фото боту: «👑 Панель» → «⚙️ Ещё» → «📷 Фото товаров».
#  category  bouquet — букет, plant — горшечное растение
#  price     цена в рублях. Нет цены или 0 — бот напишет «цена по запросу»
#            и предложит узнать цену у менеджера.
#  season    необязательно: [с какого месяца, по какой]. Вне сезона заказать нельзя.
#  note_prompt  необязательно: вопрос клиенту при оформлении («Какая песня?»). Если не указан — про комментарий не спрашиваем.
#
#  Цены букетов — из вашего списка. ЦЕНЫ РАСТЕНИЙ Я НЕ ЗНАЮ: впишите свои
#  (строка price = ...), пока не вписаны — бот покажет «цена по запросу».
#  Тексты про уход написаны по общим правилам — пусть флорист пробежит глазами.
# ══════════════════════════════════════════════════════════════════════


# ─────────────────────────── БУКЕТЫ ───────────────────────────

